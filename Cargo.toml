[package]
name = "websocket-server"
version = "1.0.0"
edition = "2021"
default-run = "websocket-server"

[dependencies]
# Alloy - Ethereum 개발 프레임워크
alloy = { version = "=1.0.25", features = ["full", "signer-keystore"] }

# 비동기 런타임
tokio = { version = "1.40.0", features = ["full"] }
tokio-stream = "0.1.16"
tokio-metrics = "0.3"


# 직렬화
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


#RESULT
anyhow = "1.0.89"
async-trait = "0.1"

# 환경 설정
dotenv = "0.15"
##POSTGRES"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls",
    "bigdecimal",
    "chrono",
    "json",
    "macros",
] }
#REDIS

redis = { version = "0.32.5", features = [
    "tokio-comp",
    "tokio-native-tls-comp",
    "json",
    "aio",
    "connection-manager",
] }


#LOG
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = [
    "time",
    "env-filter",
    "json",
    "registry",
    "ansi",
] }
once_cell = "1.21.3"

bigdecimal = { version = "0.4.8", features = ["serde-json"] }
reqwest = "0.12.22"
chrono = "0.4.41"
lazy_static = "1.5.0"
rayon = "1.10.0"

axum = { version = "0.8.4", features = ["multipart", "ws"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

tower = { version = "0.5", features = ["full"] }

tower-sessions-core = "0.14.0"
futures-util = "0.3.31"
dashmap = "6.1.0"
rand = "0.9.2"
moka = { version = "0.12", features = ["future"] }
uuid = { version = "1.11", features = ["v4", "fast-rng"] }
parking_lot = "0.12.5"


#RAND

[[bin]]
name = "stress-test"
path = "bin/stress_test.rs"

[dev-dependencies]
# 테스트용
mockito = "1.0"
